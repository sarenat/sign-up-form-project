<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Sign up!</title>
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="./form-image.jpg">
        </div>
        <div class="right">
            <div class="right-header">
                <p>This is not a real online service! You know you need
                    something like this in your life to help you realize your
                    deepest dreams. Sign up <i>now</i> to get started.
                </p>
                <p>You <i>know</i> you want to.</p>
            </div>

            <form>
                <fieldset>
                    <legend>Let's do this!</legend>
                    <div class="form-row">
                        <div class="row-left">
                            <label for="first-name">First Name</label>
                            <input type="text" id="first-name" name="first-name" />
                        </div>
                        <div class="row-right">
                            <label for="last-name">Last Name</label>
                            <input type="text" id="last-name" name="last-name" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="row-left">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" />
                        </div>

                        <div class="row-right">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="tel" name="tel" />
                        </div>
                    </div>

                    <div class="form-row">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" />

                        <label for="confirm-password">Confirm password</label>
                        <input type="confirm-password"
                            id="confirm-password" 
                            name="confirm-password"
                        />
                    </div>
                </fieldset>
            </form> 

            <div class="submit">
                <button type="button">Create Account</button>
                <p>Already have an account? <a>Log in.</a></p>
            </div>
        </div>
    </div>
</body>
</html>
