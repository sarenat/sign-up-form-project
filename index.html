<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Sign up!</title>
</head>
<body>
    <div class="container">
        <div class="left">
            <img src="./form-image.jpg" width="100%">
        </div>
        <div class="right">
            <div class="right-header">
                <p>This is not a real online service! You know you need
                    something like this in your life to help you realize your
                    deepest dreams. Sign up <i>now</i> to get started.
                </p>
                <p>You <i>know</i> you want to.</p>
            </div>

            <form>
                <fieldset>
                    <legend>Let's do this!</legend>

                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" name="first-name" />

                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" name="last-name" />

                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" />

                    <label for="phone">Phone Number</label>
                    <input type="tel" id="tel" name="tel" />

                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" />
                </fieldset>
            </form> 

            <div class="submit">
                <button type="button">Create Account</button>
                <p>Already have an account? <a>Log in.</a></p>
            </div>
        </div>
    </div>
</body>
</html>
